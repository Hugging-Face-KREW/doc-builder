# Korean terminology — PyTorchKR × Hugging Face KREW; review before publishing.
# terms-kr snapshot: 0344ae34ec247aef7b2ddd446b9d0eefcaae2447 (exported 2026-10-25).
# https://github.com/PyTorchKR/terms-kr/tree/0344ae34ec247aef7b2ddd446b9d0eefcaae2447/data
# Template: src/doc_builder/glossaries/ja.yml (pin / keep / labels).
# Preserve existing keep/labels and pins absent from the imported glossary.
# Exact-key conflicts use terms-kr: gradient → 그래디언트; fine-tuning → 미세조정.
# Imported translations are not chosen by occurrence counts. No inflections are generated.
# This file guides translations in context; it is not a blind replacement dictionary.
# Existing weight → 가중치 is retained; six other multi-meaning words are deferred below.
# The current pipeline invalidates only caches for pages mentioning affected terms.
# Merge: 239 new pins, 2 updated pins, 2 new keep entries; existing labels unchanged.
# terms-kr coverage: 254 pins + 3 protected names + 6 deferred terms = 263 terms.
# Source examples, synonyms, and definitions remain in the linked terms-kr JSON.
# Accelerate is a contextual pin so the English verb accelerate remains translatable.
