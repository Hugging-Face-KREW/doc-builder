# DEFERRED: "agent"
#   "에이전트" — 환경과 상호작용하며 보상을 최대화하기 위해 행동을 선택하는 학습 주체
#   "대리인" — 사용자를 대신하여 특정 작업을 수행하는 자율적인 소프트웨어 시스템
#   Review: https://terms.kr/#/term/agent
#
# DEFERRED: "bias"
#   "바이어스" — 신경망의 뉴런에서 가중합에 더해지는 상수 항으로, 활성화 함수의 임계값을 조정하는 매개변수
#   "편향" — 데이터나 알고리즘이 특정 집단에 대해 불공정한 결과를 초래하는 체계적인 오류
#   Review: https://terms.kr/#/term/bias
#
# DEFERRED: "feature"
#   "특징" — 모델 학습에 사용되는 입력 데이터의 개별 측정 가능한 속성
#   "기능" — 소프트웨어나 시스템이 제공하는 특정 능력이나 동작
#   Review: https://terms.kr/#/term/feature
#
# DEFERRED: "layer"
#   "층" — 신경망을 구성하는 뉴런들의 집합으로, 입력을 변환하는 기본 단위
#   "레이어" — 시스템이나 소프트웨어의 논리적 구조를 나타내는 추상화 수준
#   Review: https://terms.kr/#/term/layer
#
# DEFERRED: "loss"
#   "손실" — 모델의 예측값과 실제값 사이의 차이를 수치화한 값
#   "로스" — 정보나 성능의 감소 또는 저하
#   Review: https://terms.kr/#/term/loss
#
# DEFERRED: "model"
#   "모델" — 데이터로부터 학습된 패턴을 바탕으로 예측이나 결정을 수행하는 수학적 구조
#   "모형" — 현상을 설명하거나 예측하기 위한 수학적 또는 개념적 표현
#   Review: https://terms.kr/#/term/model
#
# EXISTING PIN RETAINED: "weight"
#   "가중치" — 신경망에서 입력 신호에 곱해지는 학습 가능한 매개변수
#   "가중" — 특정 요소에 중요도나 비중을 부여하는 것
#   Review: https://terms.kr/#/term/weight

